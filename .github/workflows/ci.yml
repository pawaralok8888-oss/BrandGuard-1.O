name: CI

on:
  push:
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest httpx

      - name: Run tests
        env:
          PYTHONPATH: backend
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          JWT_SECRET: ci-only-secret
        run: python -m pytest backend/tests/ -v -m "not integration"

  backend-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: brandguard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d brandguard"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/brandguard
      JWT_SECRET: ci-test-secret
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install fastapi uvicorn sqlalchemy "psycopg[binary]" psycopg-pool pydantic pydantic-settings pyjwt pytest httpx

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Load schema and seeds
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d brandguard -v ON_ERROR_STOP=1 -f data/schema.sql
          psql -h localhost -U postgres -d brandguard -v ON_ERROR_STOP=1 -f database/migrations/20261030_phase1_inputs.sql
          for f in data/seeds/*.sql; do
            case "$f" in
              *05_phase1_inputs.sql)
                echo "Skipping $f: it needs an intake design that is not merged yet"
                continue ;;
            esac
            echo "Loading $f"
            psql -h localhost -U postgres -d brandguard -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Run integration test (fails if skipped)
        working-directory: backend
        env:
          PYTHONPATH: .
        run: |
          set -o pipefail
          python -m pytest tests/test_fact_alerts.py -m integration -v -rs | tee integration.log
          if grep -q "SKIPPED" integration.log; then
            echo "Integration test was skipped, so the database check did not run."
            exit 1
          fi
